<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ย้อนรอย ย้อนลอร์ - Ku-Bot Factory</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Kanit', sans-serif;
        }

        body {
            background-color: #262626;
            color: #ffffff;
            line-height: 1.6;
            padding: 2rem 1rem;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 2rem;
            color: #ffffff;
        }

        /* Grid Layout */
        .article-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 1.5rem;
        }

        /* Card Style */
        .card {
            background: #676767;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.15);
            display: flex;
            flex-direction: column;
        }

        .card-img-wrapper {
            width: 100%;
            aspect-ratio: 1 / 1;
            overflow: hidden;
            background-color: #444;
        }

        .card-img-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .card:hover .card-img-wrapper img {
            transform: scale(1.05);
        }

        .card-body {
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .card h3 {
            font-size: 1.15rem;
            margin-bottom: 0.5rem;
            color: #ffffff;
        }

        .card p {
            color: #e0e0e0;
            font-size: 0.875rem;
            margin-bottom: 1rem;
            flex-grow: 1;
        }

        /* ปุ่มลิงก์เชื่อมโยงไปหน้าอื่น */
        .btn-read {
            display: block;
            text-align: center;
            background-color: #0066ff;
            color: white;
            text-decoration: none;
            padding: 0.6rem 1rem;
            border-radius: 5px;
            font-weight: bold;
            transition: background 0.2s;
            width: 100%;
        }

        .btn-read:hover {
            background-color: #0052cc;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>ย้อนรอย ย้อนลอร์ - Ku-Bot-Factory</h1>
        <div class="article-grid" id="articleGrid"></div>
    </div>

    <script>
        // กำหนด Path ลิงก์ไปยังไฟล์ .html ใน Root เดียวกันทั้งหมด
        const articles = [
            {
                title: 'Reverberation - เสียงกังวาน | ย้อนรอย ย้อนลอร์ Part 1',
                image: 'image/cover/reverberation.jpg',
                excerpt: 'เจาะลึกโครงสร้างพลังงานคลื่นเสียงตกค้าง กลไกทางวิศวกรรมดนตรี และการกำเนิดภัยพิบัติบน Solaris-3...',
                url: 'reverberation.html' // ไฟล์อยู่ใน Root เดียวกัน
            }
        ];

        function renderArticles() {
            const grid = document.getElementById('articleGrid');
            grid.innerHTML = articles.map(item => `
                <div class="card">
                    <div class="card-img-wrapper">
                        <img src="${item.image}" alt="${item.title}">
                    </div>
                    <div class="card-body">
                        <h3>${item.title}</h3>
                        <p>${item.excerpt}</p>
                        <a href="${item.url}" class="btn-read">อ่านบทความ</a>
                    </div>
                </div>
            `).join('');
        }

        renderArticles();
    </script>
</body>
</html>
