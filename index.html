<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KU-LORE ARCHIVE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #0b0e14;
            --card-bg: #151922;
            --sidebar-bg: #11141c;
            --accent-cyan: #00f2fe;
            --text-main: #e0e6ed;
            --text-muted: #8a99ad;
            --badge-bg: #00acc1;
            --danger-red: #ff4d4d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Kanit', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            padding-bottom: 60px;
        }

        /* --- HERO SECTION --- */
        .hero {
            position: relative;
            height: 35vh;
            min-height: 250px;
            background: linear-gradient(to bottom, rgba(11, 14, 20, 0.4), var(--bg-dark)),
                        url('https://picsum.photos/id/1040/1600/600') center/cover no-repeat;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            border-bottom: 1px solid #1a202c;
            padding: 0 20px;
        }

        .hero-subtitle {
            color: var(--accent-cyan);
            font-size: clamp(0.75rem, 1.5vw, 0.9rem);
            letter-spacing: 3px;
            font-weight: 600;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .hero-title {
            font-size: clamp(2rem, 5vw, 3.5rem);
            font-weight: 700;
            color: #ffffff;
            text-shadow: 0 0 15px rgba(0, 242, 254, 0.6);
            letter-spacing: 2px;
        }

        /* --- CONTAINER --- */
        .container {
            width: 95%;
            max-width: 1800px;
            margin: 30px auto 0;
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 30px;
        }

        /* --- SIDEBAR --- */
        .sidebar {
            background-color: var(--sidebar-bg);
            border-radius: 12px;
            padding: 20px;
            height: fit-content;
            border: 1px solid #1e2430;
        }

        .sidebar-title {
            color: var(--accent-cyan);
            font-size: 0.95rem;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .category-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .category-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 14px;
            border-radius: 8px;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 0.9rem;
            user-select: none;
        }

        .category-item:hover {
            background-color: rgba(255, 255, 255, 0.05);
            color: #fff;
        }

        .category-item.active {
            border: 1px solid var(--accent-cyan);
            color: var(--accent-cyan);
            background-color: rgba(0, 242, 254, 0.05);
        }

        .badge-count {
            background-color: #1e2532;
            color: var(--text-muted);
            font-size: 0.75rem;
            padding: 2px 8px;
            border-radius: 12px;
        }

        .category-item.active .badge-count {
            background-color: var(--accent-cyan);
            color: #000;
            font-weight: bold;
        }

        /* --- CONTENT AREA --- */
        .content-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-left: 4px solid var(--accent-cyan);
            padding-left: 12px;
        }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        /* ซ่อนปุ่มเพิ่มบทความถ้าไม่ใช่ Admin */
        .btn-add-article {
            background: var(--accent-cyan);
            color: #000;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            display: none;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }

        .admin-mode .btn-add-article {
            display: flex;
        }

        .btn-add-article:hover {
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.5);
            transform: translateY(-2px);
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #1e2430;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s, border-color 0.2s;
            position: relative;
        }

        .card:hover {
            transform: translateY(-4px);
            border-color: var(--accent-cyan);
        }

        .card-image-wrap {
            position: relative;
            height: 180px;
            width: 100%;
            cursor: pointer;
        }

        .card-image-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .card-badge {
            position: absolute;
            top: 10px;
            left: 10px;
            background-color: var(--badge-bg);
            color: #000;
            font-size: 0.7rem;
            font-weight: bold;
            padding: 3px 8px;
            border-radius: 4px;
        }

        /* ซ่อนปุ่มแก้ไข/ลบ บนตัวการ์ดถ้าไม่ใช่ Admin */
        .card-admin-actions {
            position: absolute;
            top: 10px;
            right: 10px;
            display: none;
            gap: 6px;
            z-index: 5;
        }

        .admin-mode .card-admin-actions {
            display: flex;
        }

        .btn-card-action {
            background: rgba(11, 14, 20, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.75rem;
            cursor: pointer;
            backdrop-filter: blur(4px);
            transition: all 0.2s;
        }

        .btn-card-action:hover {
            background: var(--accent-cyan);
            color: #000;
        }

        .btn-card-action.delete:hover {
            background: var(--danger-red);
            color: #fff;
        }

        .card-body {
            padding: 16px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            cursor: pointer;
        }

        .card-title {
            font-size: 0.95rem;
            font-weight: 600;
            margin-bottom: 8px;
            line-height: 1.4;
            color: #fff;
        }

        .card-text {
            font-size: 0.8rem;
            color: var(--text-muted);
            line-height: 1.5;
            margin-bottom: 16px;
            flex-grow: 1;
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.75rem;
            color: var(--text-muted);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding-top: 12px;
        }

        .read-more {
            color: var(--accent-cyan);
            font-weight: 600;
        }

        /* --- POPUP MODALS --- */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.25s ease-in-out;
            padding: 20px;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        /* Reading Modal */
        .modal-container {
            background-color: var(--card-bg);
            border: 1px solid var(--accent-cyan);
            border-radius: 16px;
            width: 95%;
            max-width: 1400px;
            height: 92vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 0 35px rgba(0, 242, 254, 0.25);
            position: relative;
            transform: scale(0.95);
            transition: transform 0.25s ease-in-out;
        }

        .modal-overlay.active .modal-container,
        .modal-overlay.active .form-modal-container {
            transform: scale(1);
        }

        .modal-close {
            position: absolute;
            top: 20px;
            right: 25px;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            font-size: 1.8rem;
            line-height: 1;
            cursor: pointer;
            transition: all 0.2s ease;
            z-index: 20;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-close:hover {
            background-color: var(--accent-cyan);
            color: #000;
            border-color: var(--accent-cyan);
            transform: rotate(90deg);
        }

        .modal-scroll-area {
            overflow-y: auto;
            height: 100%;
        }

        .modal-img {
            width: 100%;
            height: 40vh;
            min-height: 250px;
            object-fit: cover;
        }

        .modal-body {
            padding: 35px 40px;
        }

        .modal-badge {
            display: inline-block;
            background-color: var(--badge-bg);
            color: #000;
            font-size: 0.85rem;
            font-weight: bold;
            padding: 4px 12px;
            border-radius: 4px;
            margin-bottom: 16px;
        }

        .modal-title {
            font-size: clamp(1.5rem, 3vw, 2.2rem);
            color: #fff;
            margin-bottom: 20px;
            line-height: 1.4;
        }

        .modal-text {
            color: var(--text-main);
            font-size: 1.05rem;
            line-height: 1.8;
            font-weight: 300;
            white-space: pre-line;
        }

        /* --- FORM & AUTH MODAL --- */
        .form-modal-container {
            background-color: var(--card-bg);
            border: 1px solid var(--accent-cyan);
            border-radius: 16px;
            width: 90%;
            max-width: 650px;
            max-height: 90vh;
            overflow-y: auto;
            padding: 30px;
            position: relative;
            box-shadow: 0 0 30px rgba(0, 242, 254, 0.2);
            transform: scale(0.95);
            transition: transform 0.25s ease-in-out;
        }

        .auth-modal-container {
            max-width: 400px;
        }

        .form-title {
            font-size: 1.4rem;
            color: var(--accent-cyan);
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        .form-control {
            width: 100%;
            background: #0d1017;
            border: 1px solid #242c3d;
            border-radius: 8px;
            padding: 10px 14px;
            color: #fff;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-control:focus {
            border-color: var(--accent-cyan);
        }

        textarea.form-control {
            resize: vertical;
            min-height: 100px;
        }

        .form-actions {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 25px;
        }

        .btn-submit {
            background: var(--accent-cyan);
            color: #000;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-cancel {
            background: transparent;
            color: var(--text-muted);
            border: 1px solid #242c3d;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
        }

        .btn-cancel:hover {
            color: #fff;
        }

        .error-msg {
            color: var(--danger-red);
            font-size: 0.8rem;
            margin-top: 6px;
            display: none;
        }

        /* --- ADMIN BUTTON FIXED BOTTOM RIGHT --- */
        .admin-btn-toggle {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background-color: #11141c;
            border: 1px solid var(--accent-cyan);
            color: var(--accent-cyan);
            padding: 10px 18px;
            border-radius: 20px;
            font-size: 0.85rem;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
            transition: all 0.2s;
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .admin-btn-toggle:hover {
            background-color: var(--accent-cyan);
            color: #000;
        }

        .admin-mode .admin-btn-toggle {
            border-color: var(--danger-red);
            color: var(--danger-red);
        }

        .admin-mode .admin-btn-toggle:hover {
            background-color: var(--danger-red);
            color: #fff;
        }

        @media (max-width: 900px) {
            .container {
                grid-template-columns: 1fr;
                width: 95%;
            }
            .modal-container {
                height: 95vh;
            }
            .modal-body {
                padding: 20px;
            }
        }
    </style>
</head>
<body>

    <!-- Header Section -->
    <header class="hero">
        <div class="hero-subtitle">WUTHERING WAVES • LORE ARCHIVE HUB</div>
        <h1 class="hero-title">KU-LORE ARCHIVE</h1>
    </header>

    <!-- Main Container -->
    <div class="container">
        <!-- Sidebar Filter -->
        <aside class="sidebar">
            <div class="sidebar-title">🌐 หมวดหมู่เนื้อหา</div>
            <ul class="category-list">
                <li class="category-item active" data-category="all">
                    <span>ทั้งหมด</span>
                    <span class="badge-count" id="count-all">0</span>
                </li>
                <li class="category-item" data-category="main">
                    <span>เนื้อเรื่องหลัก</span>
                    <span class="badge-count" id="count-main">0</span>
                </li>
                <li class="category-item" data-category="characters">
                    <span>ตัวละคร & องค์กร</span>
                    <span class="badge-count" id="count-characters">0</span>
                </li>
                <li class="category-item" data-category="history">
                    <span>ประวัติศาสตร์ Sol3</span>
                    <span class="badge-count" id="count-history">0</span>
                </li>
            </ul>
        </aside>

        <!-- Cards Section -->
        <main>
            <div class="content-header">
                <div>
                    <h2 class="content-title" id="current-category-name">ทั้งหมด</h2>
                    <span class="sub-tag">คุย Lore ไม่คุย Leak</span>
                </div>
                <div class="header-controls">
                    <button class="btn-add-article" id="btn-open-add-modal">
                        <span>+</span> เพิ่มบทความ
                    </button>
                </div>
            </div>

            <div class="cards-grid" id="cards-container">
                <!-- Cards render dynamically via JavaScript -->
            </div>
        </main>
    </div>

    <!-- 1. POPUP READ ARTICLE MODAL -->
    <div class="modal-overlay" id="article-modal">
        <div class="modal-container">
            <button class="modal-close" id="modal-close-btn">&times;</button>
            <div class="modal-scroll-area">
                <img src="" alt="" class="modal-img" id="modal-img">
                <div class="modal-body">
                    <span class="modal-badge" id="modal-badge"></span>
                    <h2 class="modal-title" id="modal-title"></h2>
                    <div class="modal-text" id="modal-text"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- 2. POPUP ADD / EDIT FORM MODAL -->
    <div class="modal-overlay" id="form-modal">
        <div class="form-modal-container">
            <h3 class="form-title" id="form-modal-title">เพิ่มบทความใหม่</h3>
            <form id="article-form">
                <input type="hidden" id="form-article-id">
                
                <div class="form-group">
                    <label>หัวข้อบทความ</label>
                    <input type="text" class="form-control" id="form-title" required placeholder="ใส่ชื่อบทความ...">
                </div>

                <div class="form-group">
                    <label>หมวดหมู่</label>
                    <select class="form-control" id="form-category">
                        <option value="main">เนื้อเรื่องหลัก</option>
                        <option value="characters">ตัวละคร & องค์กร</option>
                        <option value="history">ประวัติศาสตร์ Sol3</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>ลิงก์รูปภาพ (URL)</label>
                    <input type="url" class="form-control" id="form-image" required placeholder="https://example.com/image.jpg">
                </div>

                <div class="form-group">
                    <label>เรื่องย่อ (แสดงบนการ์ด)</label>
                    <textarea class="form-control" id="form-summary" required placeholder="สั้นๆ 2-3 บรรทัด..."></textarea>
                </div>

                <div class="form-group">
                    <label>เนื้อหาฉบับเต็ม</label>
                    <textarea class="form-control" id="form-content" style="min-height: 180px;" required placeholder="รายละเอียดบทความทั้งหมด..."></textarea>
                </div>

                <div class="form-actions">
                    <button type="button" class="btn-cancel" id="btn-cancel-form">ยกเลิก</button>
                    <button type="submit" class="btn-submit">บันทึกข้อมูล</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 3. POPUP PASSWORD AUTH MODAL -->
    <div class="modal-overlay" id="auth-modal">
        <div class="form-modal-container auth-modal-container">
            <h3 class="form-title">🔑 ยืนยันสิทธิ์ Admin</h3>
            <form id="auth-form">
                <div class="form-group">
                    <label>กรอกรหัสผ่านปลดล็อก</label>
                    <input type="password" class="form-control" id="auth-password" required placeholder="Password...">
                    <div class="error-msg" id="auth-error">รหัสผ่านไม่ถูกต้อง กรุณาลองใหม่</div>
                </div>
                <div class="form-actions">
                    <button type="button" class="btn-cancel" id="btn-cancel-auth">ยกเลิก</button>
                    <button type="submit" class="btn-submit">ปลดล็อก</button>
                </div>
            </form>
        </div>
    </div>

    <!-- ADMIN TOGGLE BUTTON (BOTTOM RIGHT) -->
    <button class="admin-btn-toggle" id="btn-toggle-admin">
        <span id="admin-btn-icon">⚙️</span>
        <span id="admin-btn-text">โหมดแก้ไข (Admin)</span>
    </button>

            {

                category: 'main',
                categoryName: 'เนื้อเรื่องหลัก',
                title: 'Rover คือใคร? รวบรวมเบาะแสตัวตนของผู้ตื่นจากการหลับใหล',
                summary: 'เจาะรายละเอียดบทบาทของ Rover ตั้งแต่เริ่มตื่นขึ้นมา ความเชื่อมโยงกับ Sentinel และความลับของพลังไร้ขีดจำกัด',
                content: 'ปริศนาใหญ่ที่สุดของเรื่องคือตัวตนที่แท้จริงของ Rover ผู้ตื่นขึ้นมาพร้อมความทรงจำที่ว่างเปล่า แต่กลับมีความสามารถในการดูดซับความถี่และเชื่อมโยงกับ Sentinel ได้อย่างไร้ขีดจำกัด รวบรวมเบาะแสจากไดอะล็อก สัญลักษณ์โบราณ และปฏิกิริยาของเหล่าผู้ปกครองเมืองที่มีต่อการปรากฏตัวของ Rover...',
                image: 'https://picsum.photos/id/1025/1200/600',
                updated: '2 สัปดาห์ที่แล้ว'
            },
            {
                id: 4,
                category: 'characters',
                categoryName: 'ตัวละคร & องค์กร',
                title: 'เจาะลึกองค์กรประพาสและกลุ่มกองกำลังอิสระ',
                summary: 'ทำความรู้จักกลุ่มอิทธิพลย่อย กลุ่มพ่อค้า และกองกำลังรับจ้างที่เคลื่อนไหวอยู่นอกเขตปกครองหลัก',
                content: 'นอกจากมหาอำนาจหลักแล้ว ในโลก Sol3 ยังเต็มไปด้วยกลุ่มกองกำลังอิสระที่ออกสำรวจซากอารยธรรมโบราณเพื่อค้นหาทรัพยากรทรงคุณค่า...',
                image: 'https://picsum.photos/id/1069/1200/600',
                updated: '3 สัปดาห์ที่แล้ว'
            }
        ];

        let activeCategory = 'all';

        // DOM Elements
        const cardsContainer = document.getElementById('cards-container');
        const categoryItems = document.querySelectorAll('.category-item');
        const currentCategoryName = document.getElementById('current-category-name');
        
        // Modal Reading Elements
        const readModal = document.getElementById('article-modal');
        const modalCloseBtn = document.getElementById('modal-close-btn');
        const modalImg = document.getElementById('modal-img');
        const modalBadge = document.getElementById('modal-badge');
        const modalTitle = document.getElementById('modal-title');
        const modalText = document.getElementById('modal-text');

        // Form Modal Elements
        const formModal = document.getElementById('form-modal');
        const articleForm = document.getElementById('article-form');
        const formModalTitle = document.getElementById('form-modal-title');
        const btnOpenAddModal = document.getElementById('btn-open-add-modal');
        const btnCancelForm = document.getElementById('btn-cancel-form');

        const inputId = document.getElementById('form-article-id');
        const inputTitle = document.getElementById('form-title');
        const inputCategory = document.getElementById('form-category');
        const inputImage = document.getElementById('form-image');
        const inputSummary = document.getElementById('form-summary');
        const inputContent = document.getElementById('form-content');

        // Auth Elements
        const authModal = document.getElementById('auth-modal');
        const authForm = document.getElementById('auth-form');
        const authPassword = document.getElementById('auth-password');
        const authError = document.getElementById('auth-error');
        const btnCancelAuth = document.getElementById('btn-cancel-auth');
        const btnToggleAdmin = document.getElementById('btn-toggle-admin');
        const adminBtnIcon = document.getElementById('admin-btn-icon');
        const adminBtnText = document.getElementById('admin-btn-text');

        // ฟังก์ชันแปลงชื่อหมวดหมู่
        function getCategoryName(categoryKey) {
            switch(categoryKey) {
                case 'main': return 'เนื้อเรื่องหลัก';
                case 'characters': return 'ตัวละคร & องค์กร';
                case 'history': return 'ประวัติศาสตร์ Sol3';
                default: return 'ทั่วไป';
            }
        }

        // ฟังก์ชันคำนวณนับจำนวนการ์ด
        function updateCategoryCounts() {
            document.getElementById('count-all').textContent = articles.length;
            document.getElementById('count-main').textContent = articles.filter(a => a.category === 'main').length;
            document.getElementById('count-characters').textContent = articles.filter(a => a.category === 'characters').length;
            document.getElementById('count-history').textContent = articles.filter(a => a.category === 'history').length;
        }

        // ฟังก์ชันแสดงการ์ดบทความ
        function renderCards() {
            cardsContainer.innerHTML = '';
            
            const filteredArticles = activeCategory === 'all' 
                ? articles 
                : articles.filter(article => article.category === activeCategory);

            filteredArticles.forEach(article => {
                const card = document.createElement('article');
                card.className = 'card';

                card.innerHTML = `
                    <div class="card-admin-actions">
                        <button class="btn-card-action" onclick="openEditModal(event, ${article.id})">✏️ แก้ไข</button>
                        <button class="btn-card-action delete" onclick="deleteArticle(event, ${article.id})">🗑️ ลบ</button>
                    </div>
                    <div class="card-image-wrap" onclick="openReadModal(${article.id})">
                        <span class="card-badge">${article.categoryName}</span>
                        <img src="${article.image}" alt="${article.title}">
                    </div>
                    <div class="card-body" onclick="openReadModal(${article.id})">
                        <h3 class="card-title">${article.title}</h3>
                        <p class="card-text">${article.summary}</p>
                        <div class="card-footer">
                            <span>อัปเดต: ${article.updated}</span>
                            <span class="read-more">อ่านต่อ &rarr;</span>
                        </div>
                    </div>
                `;
                cardsContainer.appendChild(card);
            });

            updateCategoryCounts();
        }

        // ระบบคลิกเปลี่ยนหมวดหมู่ (Filter)
        categoryItems.forEach(item => {
            item.addEventListener('click', () => {
                categoryItems.forEach(i => i.classList.remove('active'));
                item.classList.add('active');

                activeCategory = item.getAttribute('data-category');
                currentCategoryName.textContent = item.querySelector('span').textContent;
                renderCards();
            });
        });

        // --- AUTH & ADMIN MODE SYSTEM ---
        btnToggleAdmin.addEventListener('click', () => {
            if (isAdmin) {
                // ออกจากโหมด Admin
                isAdmin = false;
                document.body.classList.remove('admin-mode');
                adminBtnIcon.textContent = '⚙️';
                adminBtnText.textContent = 'โหมดแก้ไข (Admin)';
            } else {
                // เปิด Pop-up กรอกรหัสผ่าน
                authPassword.value = '';
                authError.style.display = 'none';
                authModal.classList.add('active');
                document.body.style.overflow = 'hidden';
            }
        });

        authForm.addEventListener('submit', (e) => {
            e.preventDefault();
            if (authPassword.value === ADMIN_PASSWORD) {
                isAdmin = true;
                document.body.classList.add('admin-mode');
                adminBtnIcon.textContent = '🔒';
                adminBtnText.textContent = 'ออกจากโหมด Admin';
                authModal.classList.remove('active');
                document.body.style.overflow = 'auto';
            } else {
                authError.style.display = 'block';
            }
        });

        btnCancelAuth.addEventListener('click', () => {
            authModal.classList.remove('active');
            document.body.style.overflow = 'auto';
        });

        authModal.addEventListener('click', (e) => {
            if (e.target === authModal) {
                authModal.classList.remove('active');
                document.body.style.overflow = 'auto';
            }
        });

        // --- POPUP READ FUNCTIONS ---
        function openReadModal(articleId) {
            const article = articles.find(a => a.id === articleId);
            if (!article) return;

            modalImg.src = article.image;
            modalBadge.textContent = article.categoryName;
            modalTitle.textContent = article.title;
            modalText.textContent = article.content;
            readModal.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeReadModal() {
            readModal.classList.remove('active');
            document.body.style.overflow = 'auto';
        }

        modalCloseBtn.addEventListener('click', closeReadModal);
        readModal.addEventListener('click', (e) => {
            if (e.target === readModal) closeReadModal();
        });

        // --- ADD / EDIT / DELETE FUNCTIONS ---
        btnOpenAddModal.addEventListener('click', () => {
            articleForm.reset();
            inputId.value = '';
            formModalTitle.textContent = 'เพิ่มบทความใหม่';
            formModal.classList.add('active');
            document.body.style.overflow = 'hidden';
        });

        function openEditModal(event, articleId) {
            event.stopPropagation();
            const article = articles.find(a => a.id === articleId);
            if (!article) return;

            inputId.value = article.id;
            inputTitle.value = article.title;
            inputCategory.value = article.category;
            inputImage.value = article.image;
            inputSummary.value = article.summary;
            inputContent.value = article.content;

            formModalTitle.textContent = 'แก้ไขบทความ';
            formModal.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeFormModal() {
            formModal.classList.remove('active');
            document.body.style.overflow = 'auto';
        }

        btnCancelForm.addEventListener('click', closeFormModal);
        formModal.addEventListener('click', (e) => {
            if (e.target === formModal) closeFormModal();
        });

        articleForm.addEventListener('submit', (e) => {
            e.preventDefault();

            const id = inputId.value;
            const title = inputTitle.value;
            const category = inputCategory.value;
            const image = inputImage.value;
            const summary = inputSummary.value;
            const content = inputContent.value;

            if (id) {
                const articleIndex = articles.findIndex(a => a.id == id);
                if (articleIndex !== -1) {
                    articles[articleIndex] = {
                        ...articles[articleIndex],
                        title,
                        category,
                        categoryName: getCategoryName(category),
                        image,
                        summary,
                        content,
                        updated: 'แก้ไขเมื่อครู่นี้'
                    };
                }
            } else {
                const newArticle = {
                    id: Date.now(),
                    category,
                    categoryName: getCategoryName(category),
                    title,
                    summary,
                    content,
                    image,
                    updated: 'เพิ่งสร้าง'
                };
                articles.unshift(newArticle);
            }

            renderCards();
            closeFormModal();
        });

        function deleteArticle(event, articleId) {
            event.stopPropagation();
            if (confirm('คุณต้องการลบบทความนี้ใช่หรือไม่?')) {
                articles = articles.filter(a => a.id !== articleId);
                renderCards();
            }
        }

        // Initialize App
        renderCards();
    </script>
</body>
</html>
